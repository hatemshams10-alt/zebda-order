<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ZEBDA &amp; CO. — Confirmed Orders Admin Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;600;700&family=Cormorant+Garamond:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />
  <style>
    body {
      background-color: #F7F3EA;
      color: #1E1916;
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
    }
    .arabic-text { font-family: 'Cairo', sans-serif; }
  </style>
</head>
<body class="min-h-screen p-4 sm:p-8">
  <div class="max-w-5xl mx-auto">
    <header class="bg-[#EFE9DA] border border-[#1E1916]/15 rounded-2xl p-6 mb-6 flex flex-wrap items-center justify-between gap-4">
      <div>
        <span class="text-xs uppercase tracking-[0.2em] text-[#7A1C1C] font-bold block">Zebda &amp; Co. Operations</span>
        <h1 class="font-serif text-3xl font-bold text-[#1E1916]">Confirmed Orders Portal</h1>
        <p class="text-xs text-[#1E1916]/75 mt-1">
          Receives confirmed orders from the website &amp; chat widget, supports manual entry, status updates, and CSV export.
        </p>
      </div>
      <div class="flex flex-wrap gap-2">
        <a href="index.html" class="px-3.5 py-2 rounded-xl bg-[#F7F3EA] border border-[#1E1916]/20 text-xs font-bold hover:bg-white">
          Back to Menu
        </a>
        <button type="button" onclick="renderOrders()" class="px-3.5 py-2 rounded-xl bg-[#1E1916] text-[#F7F3EA] text-xs font-bold cursor-pointer">
          Refresh
        </button>
        <button type="button" onclick="addManualOrder()" class="px-3.5 py-2 rounded-xl bg-[#1E4620] text-[#F7F3EA] text-xs font-bold cursor-pointer">
          + Add Manual Order
        </button>
        <button type="button" onclick="exportOrdersCsv()" class="px-3.5 py-2 rounded-xl bg-[#C59B43] text-[#1E1916] text-xs font-bold cursor-pointer">
          Export CSV
        </button>
        <button type="button" onclick="clearAllOrders()" class="px-3.5 py-2 rounded-xl bg-[#7A1C1C] text-[#F7F3EA] text-xs font-bold cursor-pointer">
          Clear All
        </button>
      </div>
    </header>

    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-6">
      <div class="bg-[#EFE9DA] border border-[#1E1916]/15 rounded-2xl p-4">
        <span class="text-xs uppercase tracking-wider text-[#1E1916]/65 font-bold block">Total Confirmed Orders</span>
        <span id="stat-total" class="text-2xl font-bold text-[#1E1916]">0</span>
      </div>
      <div class="bg-[#EFE9DA] border border-[#1E1916]/15 rounded-2xl p-4">
        <span class="text-xs uppercase tracking-wider text-[#1E1916]/65 font-bold block">Active / Preparing</span>
        <span id="stat-active" class="text-2xl font-bold text-[#1E4620]">0</span>
      </div>
      <div class="bg-[#EFE9DA] border border-[#1E1916]/15 rounded-2xl p-4">
        <span class="text-xs uppercase tracking-wider text-[#1E1916]/65 font-bold block">Last Refreshed</span>
        <span id="stat-time" class="text-sm font-bold text-[#1E1916]">—</span>
      </div>
    </div>

    <div id="orders-container" class="space-y-4"></div>
  </div>

  <script>
    const ORDERS_STORAGE_KEY = "zebda_confirmed_orders_v1";

    function loadOrders() {
      try {
        return JSON.parse(localStorage.getItem(ORDERS_STORAGE_KEY) || "[]");
      } catch (_) {
        return [];
      }
    }

    function saveOrders(list) {
      localStorage.setItem(ORDERS_STORAGE_KEY, JSON.stringify(list));
      renderOrders();
    }

    function renderOrders() {
      const orders = loadOrders();
      const container = document.getElementById("orders-container");
      document.getElementById("stat-total").textContent = String(orders.length);
      document.getElementById("stat-active").textContent = String(orders.filter((o) => o.status !== "Delivered").length);
      document.getElementById("stat-time").textContent = new Date().toLocaleTimeString();

      if (orders.length === 0) {
        container.innerHTML =
          '<div class="bg-[#EFE9DA] border border-dashed border-[#1E1916]/25 rounded-2xl p-10 text-center text-sm text-[#1E1916]/70">No confirmed orders yet. Orders confirmed on the website or chat will appear here automatically.</div>';
        return;
      }

      container.innerHTML = "";
      orders.forEach((order, index) => {
        const card = document.createElement("article");
        card.className = "bg-[#EFE9DA] border border-[#1E1916]/15 rounded-2xl p-5";
        card.innerHTML = `
          <div class="flex flex-wrap items-center justify-between gap-2 pb-3 mb-3 border-b border-[#1E1916]/12">
            <div>
              <span class="font-bold text-sm text-[#1E1916]">${order.id || "ORD"}</span>
              <span class="text-xs text-[#1E1916]/65 ml-2">${order.createdAt || ""}</span>
            </div>
            <div class="flex items-center gap-2">
              <span class="px-2.5 py-1 rounded-full text-xs font-bold bg-[#1E4620] text-[#F7F3EA]">${order.status || "Confirmed"}</span>
              <button type="button" data-toggle="${index}" class="px-2.5 py-1 rounded-lg bg-[#F7F3EA] border border-[#1E1916]/20 text-xs font-bold cursor-pointer">
                Mark Delivered
              </button>
              <button type="button" data-del="${index}" class="px-2.5 py-1 rounded-lg bg-[#7A1C1C] text-[#F7F3EA] text-xs font-bold cursor-pointer">
                Delete
              </button>
            </div>
          </div>
          <pre class="whitespace-pre-wrap text-xs sm:text-sm bg-[#F7F3EA] border border-[#1E1916]/12 rounded-xl p-3.5 text-[#1E1916]"></pre>
        `;
        card.querySelector("pre").textContent = order.summary || "";
        card.querySelector(`[data-toggle="${index}"]`).addEventListener("click", () => {
          const list = loadOrders();
          list[index].status = list[index].status === "Delivered" ? "Confirmed" : "Delivered";
          saveOrders(list);
        });
        card.querySelector(`[data-del="${index}"]`).addEventListener("click", () => {
          const list = loadOrders();
          list.splice(index, 1);
          saveOrders(list);
        });
        container.appendChild(card);
      });
    }

    function addManualOrder() {
      const summary = prompt("Enter confirmed order summary:");
      if (!summary || !summary.trim()) return;
      const list = loadOrders();
      list.unshift({
        id: "ORD-" + Date.now().toString().slice(-6),
        createdAt: new Date().toLocaleString("en-EG"),
        summary: summary.trim(),
        status: "Confirmed",
      });
      saveOrders(list);
    }

    function exportOrdersCsv() {
      const orders = loadOrders();
      if (!orders.length) return;
      const rows = [["Order ID", "Created At", "Status", "Summary"]];
      orders.forEach((o) => {
        rows.push([o.id || "", o.createdAt || "", o.status || "", String(o.summary || "").replace(/"/g, '""')]);
      });
      const csv = rows.map((r) => r.map((c) => `"${c}"`).join(",")).join("
");
      const blob = new Blob(["﻿" + csv], { type: "text/csv;charset=utf-8;" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "zebda-confirmed-orders.csv";
      a.click();
      URL.revokeObjectURL(url);
    }

    function clearAllOrders() {
      if (confirm("Clear all confirmed orders from this browser?")) {
        saveOrders([]);
      }
    }

    renderOrders();
  </script>
</body>
</html>
